name: Dev Android V8

on:
  workflow_dispatch:

jobs:
  android-dev-v8:
    name: Dev Android arm64-v8a
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: 代码迁出
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 构建Java环境
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"
          cache-dependency-path: |
            android/*.gradle*
            android/**/gradle-wrapper.properties

      - name: 安装Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 android

      - name: Set and Extract version
        shell: pwsh
        run: lib/scripts/build.ps1 android

      - name: Flutter Build Dev Apk (arm64-v8a only)
        run: flutter build apk --release --target-platform android-arm64 --android-project-arg dev=1 --no-pub

      - name: Rename
        shell: bash
        run: |
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "PiliPlus_android_${{ env.version }}_arm64-v8a.apk"
          ls -lh PiliPlus_android_*_arm64-v8a.apk

      - name: 上传
        uses: actions/upload-artifact@v7
        with:
          name: Android_arm64-v8a_dev
          path: PiliPlus_android_*_arm64-v8a.apk
          if-no-files-found: error
